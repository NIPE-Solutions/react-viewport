<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">React Viewport visual viewport and composer geometry</title>
  <desc id="description">A composer sits inside the visual viewport above keyboard occlusion, nested within the layout viewport and safe-area edges.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CAD6DC" stroke-width="1"/>
    </pattern>
    <clipPath id="visual-clip">
      <rect x="758" y="106" width="330" height="340" rx="4"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#F4F7F8"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".62"/>

  <g font-family="Barlow, Arial, sans-serif" fill="#15232D">
    <text x="70" y="91" font-family="IBM Plex Mono, monospace" font-size="22">@nipe-solutions/react-viewport</text>
    <text x="70" y="194" font-size="50" font-weight="700">Know what part of the</text>
    <text x="70" y="254" font-size="50" font-weight="700">screen is actually usable.</text>
    <text x="70" y="335" font-size="27">Visual viewport, keyboard and safe-area</text>
    <text x="70" y="373" font-size="27">geometry for React.</text>

    <g font-family="IBM Plex Mono, monospace" font-size="18">
      <rect x="70" y="478" width="14" height="14" fill="#2257D6"/>
      <text x="96" y="491">layout</text>
      <rect x="198" y="478" width="14" height="14" fill="#18A6B7"/>
      <text x="224" y="491">visual</text>
      <rect x="336" y="478" width="14" height="14" fill="#E2634D"/>
      <text x="362" y="491">occlusion</text>
    </g>
  </g>

  <g>
    <rect x="700" y="54" width="446" height="522" rx="8" fill="#F4F7F8" stroke="#2257D6" stroke-width="7"/>
    <text x="722" y="88" fill="#2257D6" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600">Layout viewport</text>

    <rect x="758" y="106" width="330" height="340" rx="4" fill="#EAF5F7" stroke="#18A6B7" stroke-width="6"/>
    <g clip-path="url(#visual-clip)">
      <rect x="758" y="106" width="330" height="25" fill="#18A6B7" opacity=".22"/>
      <rect x="758" y="106" width="18" height="340" fill="#18A6B7" opacity=".22"/>
      <rect x="1070" y="106" width="18" height="340" fill="#18A6B7" opacity=".22"/>

      <circle cx="817" cy="179" r="22" fill="#CAD6DC"/>
      <rect x="854" y="160" width="164" height="15" rx="7" fill="#CAD6DC"/>
      <rect x="854" y="185" width="116" height="11" rx="5" fill="#CAD6DC" opacity=".72"/>
      <rect x="806" y="240" width="196" height="50" rx="14" fill="#FFFFFF" stroke="#CAD6DC" stroke-width="2"/>
      <rect x="844" y="310" width="208" height="50" rx="14" fill="#DCE6FA"/>

      <rect x="784" y="377" width="278" height="47" rx="5" fill="#FFFFFF" stroke="#15232D" stroke-width="2"/>
      <circle cx="1038" cy="400" r="13" fill="#2257D6"/>
      <path d="m1033 400 5 5 8-11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="781" y="151" fill="#147D8B" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600">Visual viewport</text>
    <text x="804" y="407" fill="#15232D" font-family="IBM Plex Mono, monospace" font-size="16">composer</text>

    <rect x="700" y="466" width="446" height="110" fill="#E2634D"/>
    <path d="M729 497h388M729 523h388M729 549h388" stroke="#F4F7F8" stroke-width="9" stroke-linecap="round" stroke-dasharray="23 14" opacity=".82"/>
    <rect x="774" y="480" width="298" height="65" fill="#E2634D" opacity=".94"/>
    <text x="801" y="520" fill="#F4F7F8" font-family="IBM Plex Mono, monospace" font-size="19" font-weight="600">Keyboard occlusion</text>
  </g>
</svg>
