name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@nipe-solutions/react-viewport
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Run full quality gate
        run: npm run check
      - name: Validate release metadata and repository state
        run: npm run release:check -- --tag "$GITHUB_REF_NAME" --dist-tag alpha
      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish with npm trusted publishing
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag alpha --provenance
