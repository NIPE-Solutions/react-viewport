<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Visual viewport geometry as React state</title>
  <desc id="description">Nested layout and visual viewport boundaries with coordinate lines, offsets and scale.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#CAD6DC" stroke-width="1"/></pattern></defs>
  <rect width="1200" height="630" fill="#F4F7F8"/><rect width="1200" height="630" fill="url(#grid)" opacity=".6"/>
  <g font-family="Arial,sans-serif" fill="#15232D">
    <text x="64" y="94" font-family="monospace" font-size="22">@nipe-solutions/react-viewport</text>
    <text x="64" y="208" font-size="52" font-weight="700">Visual viewport</text><text x="64" y="272" font-size="52" font-weight="700">geometry as</text><text x="64" y="336" font-size="52" font-weight="700">React state.</text>
    <text x="64" y="440" font-size="25">CSS owns layout.</text><text x="64" y="479" font-size="25">Your application owns the logic.</text>
    <text x="64" y="570" font-family="monospace" font-size="19">offsets · scale · occlusion · safe area</text>
  </g>
  <rect x="700" y="54" width="440" height="522" fill="#F4F7F8" stroke="#2257D6" stroke-width="5"/>
  <text x="722" y="90" fill="#173E9C" font-family="monospace" font-size="18">LAYOUT VIEWPORT</text>
  <path d="M722 156H758M758 110V156" stroke="#E2634D" stroke-width="3"/>
  <rect x="758" y="156" width="330" height="340" fill="#EAF5F7" stroke="#18A6B7" stroke-width="4" stroke-dasharray="9 5"/>
  <g fill="#15232D" font-family="monospace" font-size="19"><text x="780" y="196">VISUAL VIEWPORT</text><text x="780" y="278">height     487</text><text x="780" y="323">offsetTop   24</text><text x="780" y="368">scale      1.0</text></g>
  <text x="758" y="544" fill="#173E9C" font-family="monospace" font-size="17">Illustrated coordinate model</text>
</svg>
