name: Production verification

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify both production aliases after automatic Git deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            if node scripts/verify-production.mjs "$EXPECTED_SHA"; then
              exit 0
            fi
            sleep 15
          done
          echo 'Production did not converge to the intended commit.'
          exit 1
